<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{APP_TITLE}}</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <div class="logo"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9"/></svg></div>
    <h1>{{APP_TITLE}}</h1>
  </header>

  <main>
    <section class="stats">
      <div class="stat"><span id="s-total">0</span><small>Total</small></div>
      <div class="stat pend"><span id="s-pending">0</span><small>Pending</small></div>
      <div class="stat done"><span id="s-done">0</span><small>Completed</small></div>
      <div class="stat late"><span id="s-late">0</span><small>Overdue</small></div>
    </section>

    <div class="progress"><div id="bar"></div></div>

    <form id="task-form" class="card">
      <input id="title" placeholder="What needs to be done?" required autocomplete="off">
      <div class="row">
        <select id="priority"><option>High</option><option selected>Medium</option><option>Low</option></select>
        <select id="category"><option>General</option><option>Assignment</option><option>Project</option><option>Exam</option><option>Lab</option></select>
        <input id="deadline" type="date">
        <select id="status"><option selected>Pending</option><option>Completed</option></select>
        <button type="submit" class="primary"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Add</button>
      </div>
    </form>

    <div class="toolbar">
      <div class="search"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="search" placeholder="Search tasks"></div>
      <select id="filter"><option value="">All status</option><option>Pending</option><option>Completed</option></select>
      <select id="fcat"><option value="">All categories</option><option>General</option><option>Assignment</option><option>Project</option><option>Exam</option><option>Lab</option></select>
      <select id="sort"><option value="id">Newest first</option><option value="priority">Priority</option><option value="deadline">Deadline</option></select>
      <button id="clear" class="ghost" type="button">Clear completed</button>
    </div>

    <div id="list"></div>
    <div id="empty" class="empty" hidden>
      <svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8 8h8M8 12h8M8 16h4"/></svg>
      <p>No tasks here. Add one above.</p>
    </div>
  </main>
  <div id="toast"></div>
  <script src="/script.js"></script>
</body>
</html>
